id: ultimate-workflow

info:
  name: Ultimate Technology Workflow
  author: pastaga
  description: |
    Exhaustive tiered tech detection (reduce requests on lower tiers):
    1) favicon-detect — full favicon catalog
    2) tech-detect — full Wappalyzer catalog
    3) fingerprinthub-web-fingerprints — full FingerprintHub catalog
    4) http/technologies detect — tech-all minus tiers 1-3 tags
    5) http/exposed-panels — exposed panels minus tiers 1-4 tags
  tags: workflow,tech,ultimate,tiered

workflows:
